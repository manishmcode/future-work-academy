<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>404 Page Not Found | FutureWorkAcademy</title>
  <meta name="description" content="The requested FutureWorkAcademy page could not be found." />
  <link rel="canonical" href="https://futureworkacademy.net/404/" />
  <meta property="og:title" content="404 Page Not Found | FutureWorkAcademy" />
  <meta property="og:description" content="The requested FutureWorkAcademy page could not be found." />
  <meta property="og:url" content="https://futureworkacademy.net/404/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <style>
    :root {
      color-scheme: light;
      --pink: #db2777;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-900: #0f172a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--slate-50);
      color: var(--slate-900);
    }

    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--slate-900);
      text-decoration: none;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #ec4899;
      color: #fff;
      box-shadow: 0 12px 24px rgba(219, 39, 119, 0.25);
      font-weight: 900;
    }

    main {
      position: relative;
      flex: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 72px 20px 96px;
      text-align: center;
    }

    main::before,
    main::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(64px);
      pointer-events: none;
    }

    main::before {
      left: -110px;
      top: 60px;
      width: 288px;
      height: 288px;
      background: rgba(251, 207, 232, 0.65);
    }

    main::after {
      right: -90px;
      bottom: -70px;
      width: 340px;
      height: 340px;
      background: rgba(186, 230, 253, 0.7);
    }

    .content {
      position: relative;
      max-width: 640px;
      z-index: 1;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: #fce7f3;
      color: var(--pink);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .eyebrow {
      margin: 0;
      color: var(--pink);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 18px;
      font-size: clamp(42px, 6vw, 56px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    p {
      max-width: 460px;
      margin: 0 auto;
      color: var(--slate-600);
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      margin-top: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 12px;
      background: var(--slate-900);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.18);
      transition: background 180ms ease, transform 180ms ease;
    }

    .button:hover {
      background: var(--pink);
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <a class="brand" href="/" aria-label="FutureWorkAcademy home">
        <span class="mark">F.</span>
        <span>FutureWorkAcademy</span>
      </a>
    </header>

    <main>
      <div class="content">
        <div class="icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <p class="eyebrow">Error 404</p>
        <h1>This page does not exist.</h1>
        <p>The link may be incorrect, or the page may have moved. Let us get you back on track.</p>
        <a class="button" href="/">Back to home</a>
      </div>
    </main>
  </div>
</body>

</html>
